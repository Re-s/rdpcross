name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # 1. x86_64 AppImage
  # ---------------------------------------------------------------
  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 必须全历史：CMake 用 git describe 取最近版本 tag 推导版本号，
        # shallow(depth=1) 拿不到 v* tag → 版本号错误回退到 constants.h 硬编码。
        with:
          fetch-depth: 0

      # 缓存层 1：apt 包列表 + 已下载 deb
      - name: Cache apt lists & archives
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists/*
            /var/cache/apt/archives/*
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          FQP=""
          for p in libfreerdp3-dev freerdp3-dev freerdp2-dev; do
            if sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then FQP="$p"; break; fi
          done
          echo "freerdp: '${FQP:-none}'"
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config patchelf python3 wget curl qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev xvfb
          # xvfb 必装：quick-sharun 用 xvfb-run 提供显示，让 Qt 以 xcb 平台
          # 启动，LD_DEBUG=libs 才能抓到运行时 dlopen 的平台插件 libqxcb.so

      # 缓存层 2：cmake 输出树
      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ github.sha }}
          restore-keys: |
            cmake-build-${{ github.sha }}

      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1

      # 缓存层 3：appimagetool + quick-sharun 依赖
      - name: Cache AppImage toolchain
        uses: actions/cache@v4
        with:
          path: |
            appimage/appimagetool
            /tmp/sharun+helper-libs-x86_64.tar
            /tmp/cross-libc-dlopen-x86_64.tar
          key: appimagetool-${{ runner.os }}-${{ hashFiles('appimage/appimagetool','appimage/quick-sharun.sh') }}
          restore-keys: |
            appimagetool-${{ runner.os }}-

      - name: Package AppImage
        run: |
          cd appimage
          # 不依赖 git 文件模式（经 API 上传的 tree 条目可能丢失 +x 位）
          chmod +x quick-sharun.sh build-appimage.sh
          export DWARFS_COMP="zstd:level=3"
          # 不能设 QT_QPA_PLATFORM=offscreen：否则 LD_DEBUG=libs 只抓到
          # libqoffscreen.so，libqxcb.so 永远不会被收集，用户机器上
          # Qt 回退系统插件路径 → 版本不兼容 → 启动崩溃
          ./build-appimage.sh

      - name: Verify Qt xcb plugin deployed
        run: |
          # 回归保护：libqxcb.so 是运行时 dlopen 的，quick-sharun 只在
          # 程序能以 xcb 平台真实启动（xvfb-run 提供 display 且未设
          # QT_QPA_PLATFORM=offscreen）时才会收集。缺失会导致用户机器
          # 上 Qt 回退系统插件路径而版本不兼容崩溃。
          if [ -f appimage/AppDir/lib/qt6/plugins/platforms/libqxcb.so ]; then
            echo "XCB PLUGIN OK: $(ls -la appimage/AppDir/lib/qt6/plugins/platforms/libqxcb.so)"
            ls appimage/AppDir/lib/ | grep -i xcb || true
          else
            echo "XCB PLUGIN MISSING — AppImage 无法在用户机器启动"
            find appimage/AppDir -name "*.so*" | grep -iE "xcb|offscreen" || true
            exit 1
          fi

      - name: Smoke test AppImage (xcb)
        run: |
          AI=$(ls dist/*.AppImage | head -1)
          chmod +x "$AI"
          echo "smoke test: $AI"
          set +e
          Xvfb :77 -screen 0 1280x800x24 -nolisten tcp >/dev/null 2>&1 &
          XPID=$!
          sleep 3
          DISPLAY=:77 timeout 20 "$AI" >/tmp/ai.log 2>&1
          rc=$?
          kill $XPID 2>/dev/null || true
          set -e
          # rc=124 表示被 timeout 杀掉 ⇒ GUI 一直正常运行
          if [ "$rc" = "124" ]; then
            echo "SMOKE OK: AppImage 以 xcb 平台持续运行 15s+"
          else
            echo "SMOKE FAIL (exit=$rc)"
            cat /tmp/ai.log
            exit 1
          fi
          grep -iqE "qt.qpa|platform plugin|failed to start" /tmp/ai.log \
            && { echo "检测到 Qt 平台错误"; cat /tmp/ai.log; exit 1; } || true

      - name: Analyze AppDir size
        run: |
          du -sh appimage/AppDir 2>/dev/null || true
          echo "--- AppDir/lib 子目录 Top 15 ---"
          du -sh appimage/AppDir/lib/* 2>/dev/null | sort -rh | head -15
          echo "--- libQt6* 大文件 Top 10 ---"
          ls -laS appimage/AppDir/lib/libQt6* 2>/dev/null | head -11
          echo "--- qt6 plugins 子目录 ---"
          du -sh appimage/AppDir/lib/qt6/plugins/* 2>/dev/null | sort -rh

      - name: Upload appimage
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-appimage
          path: |
            # 产物：AppImage + 版号文件（做 CI 发布的来源）
            dist/*.AppImage
            dist/VERSION_FULL.txt
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. deb（amd64）
  # ---------------------------------------------------------------
  build-deb:
    name: Build deb (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 必须全历史：CMake 用 git describe 取最近版本 tag 推导版本号，
        # shallow(depth=1) 拿不到 v* tag → 版本号错误回退到 constants.h 硬编码。
        with:
          fetch-depth: 0

      # 宽松：deb 不需要显示，只要 freerdp + qt6 开发库和 dpkg 工具链
      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          FQP=""
          for p in libfreerdp3-dev freerdp3-dev freerdp2-dev; do
            if sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then FQP="$p"; break; fi
          done
          echo "freerdp: '${FQP:-none}'"
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config patchelf python3 wget curl qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev
          echo "DEP OK"

      # 构建 native 二进制
      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1
          echo "QCMDSIZE: $(wc -c < build/rdpcross) bytes"

      # dpkg-deb 手动打包：可控最小体积，不含 AppImage 专用的 sharun/uruntime
      - name: Package deb
        run: |
          PKGVER=$(cat build/VERSION_FULL.txt)
          echo "version=$PKGVER"
          PKG=dpkgbuild
          rm -rf "$PKG" && mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/scalable/apps"
          # control 信息必须完整合规，dpkg-deb --build 不接受空控制
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: rdpcross
          Version: ${PKGVER}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Re-s <re-s@users.noreply.github.com>
          Description: RDPCross 跨平台 RDP 远程桌面客户端
           基于 Qt6 + FreeRDP3，支持 .rdp 导入导出、嵌入多会话、智能缩放与
           动态分辨率。
          Depends: libc6, libgl1, libx11-6
          EOF
          cp build/rdpcross "$PKG/usr/bin/rdpcross"
          cp resources/rdpcross.desktop "$PKG/usr/share/applications/"
          cp resources/rdpcross.svg "$PKG/usr/share/icons/hicolor/scalable/apps/"
          chmod 755 "$PKG/usr/bin/rdpcross"
          dpkg-deb --build --root-owner-group "$PKG" \
            "rdpcross-${PKGVER}-amd64.deb"
          ls -la *.deb || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-deb
          path: rdpcross-*.deb
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. arm64（Docker QEMU，容器内原生 gcc + arm64 开发库，一次性构建）
  # ---------------------------------------------------------------
  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 必须全历史：CMake 用 git describe 取最近版本 tag 推导版本号，
        # shallow(depth=1) 拿不到 v* tag → 版本号错误回退到 constants.h 硬编码。
        with:
          fetch-depth: 0

      - name: Setup QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Build arm64 (Docker QEMU)
        run: |
          rm -rf build && mkdir -p build
          docker run --rm --platform linux/arm64 --volume "$PWD:/app:rw" ubuntu:noble sh -c '
            cd /app &&
            apt-get update -q > /dev/null 2>&1 && echo "APT UPDATE OK" &&
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config \
              qt6-base-dev freerdp3-dev \
              libasound2-dev libpulse-dev libx11-dev libgl-dev > /dev/null 2>&1 &&
            echo "DEPS READY" &&
            rm -rf build && mkdir -p build &&
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1 &&
            echo "CMAKE OK" &&
            ninja -C build -j1 > /tmp/ninja.log 2>&1 &&
            echo "NINJA OK" &&
            ls -la build/rdpcross
                  '
        env:
          QT_QPA_PLATFORM: offscreen

      # 与 x86_64 deb 相同的手动打包流程，仅 Architecture/产物名不同。
      # dpkg-deb 只负责打包，不涉及交叉工具链，宿主机直接执行即可。
      - name: Package deb (arm64)
        run: |
          PKGVER=$(cat build/VERSION_FULL.txt)
          echo "version=$PKGVER"
          PKG=dpkgbuild-arm64
          rm -rf "$PKG" && mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/scalable/apps"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: rdpcross
          Version: ${PKGVER}
          Section: net
          Priority: optional
          Architecture: arm64
          Maintainer: Re-s <re-s@users.noreply.github.com>
          Description: RDPCross 跨平台 RDP 远程桌面客户端
           基于 Qt6 + FreeRDP3，支持 .rdp 导入导出、嵌入多会话、智能缩放与
           动态分辨率。
          Depends: libc6, libgl1, libx11-6
          EOF
          cp build/rdpcross "$PKG/usr/bin/rdpcross"
          cp resources/rdpcross.desktop "$PKG/usr/share/applications/"
          cp resources/rdpcross.svg "$PKG/usr/share/icons/hicolor/scalable/apps/"
          chmod 755 "$PKG/usr/bin/rdpcross"
          dpkg-deb --build --root-owner-group "$PKG" \
            "rdpcross-${PKGVER}-arm64.deb"
          ls -la *.deb || true

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-arm64
          path: |
            build/rdpcross
            rdpcross-*.deb
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Release
  # ---------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-appimage, build-arm64, build-deb]
    # 触发方式：push main 自动 / 手动（workflow_dispatch）/ push v* tag / release published。
    # push main 自动跑之后 release 会自动创建（tag 不存在时新建、已存在时更新），不再需要手动打 tag。
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 必须全历史：CMake 用 git describe 取最近版本 tag 推导版本号，
        # shallow(depth=1) 拿不到 v* tag → 版本号错误回退到 constants.h 硬编码。
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        run: |
          # 从构建产物取完整构建版号（vrndis 风格：2.0.0-N-g<hash>）
          version=$(cat artifacts/rdpcross-appimage/VERSION_FULL.txt)
          echo "version=$version"
          # arm64 裸二进制重命名，避免与 AppImage 混淆
          mv artifacts/rdpcross-arm64/rdpcross "artifacts/rdpcross-arm64/rdpcross-${version}-arm64"
          # release 资产名只允许 ASCII：原名含中文会被 GitHub 清理成乱码
          mv artifacts/rdpcross-appimage/*.AppImage \
            "artifacts/rdpcross-appimage/rdpcross-${version}-anylinux-x86_64.AppImage" \
            || true  # 产物已经同名，无需再重命名
          # tag 事件：release 直接挂到触发它的真实版本 tag（如 v2.1.0）。
          # 不能用 describe 输出 vX.Y.Z-N-gHASH 当 tag 名——这种"长得像版本号"
          # 的假 tag 会被下一次构建的 git describe 当成最近版本 tag，把版本号
          # 污染/锁死在错误前缀上（v2.0.0-1 系列就是这么来的）。
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          # 自动更新：这个 tag 的 release 存在 → 保留标题/描述，只重传新资产
          # 不存在 → 创建 release（git tag 也由 gh 自动建，不需要提前打 tag）
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "RELEASE EXISTS: updating $tag"
            gh release edit "$tag" --title "RDPCross $tag" --generate-notes
          else
            echo "RELEASE NEW: creating $tag"
            gh release create "$tag" --target main --title "RDPCross $tag" --generate-notes
          fi
          gh release upload "$tag" \
            artifacts/rdpcross-appimage/rdpcross-${version}-anylinux-x86_64.AppImage \
            artifacts/rdpcross-deb/rdpcross-${version}-amd64.deb \
            artifacts/rdpcross-arm64/rdpcross-${version}-arm64.deb \
            artifacts/rdpcross-arm64/rdpcross-${version}-arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
