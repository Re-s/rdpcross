name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  arm64-toolchain-check:
    name: Check arm64 toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Check cmake toolchain file
        working-directory: .  # root
        run: |
          echo "=== CMAKERUN ==="
          cmake -B /tmp/build-arm64-check -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/Toolchain-arm64.cmake" 2>&1 | head -20
          echo "=== AARCH64 compiler ==="
          aarch64-linux-gnu-g++ --version | head -1

      - name: Stop (no real build)
        run: echo "arm64 cross build needs arm64 Qt6/FreerDP dev libs; see README"
        working-directory: .

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存层 1：apt 包列表 + 已下载 deb，避免重复 apt-get update（Qt6 + FreeRDP）
      - name: Cache apt lists & archives
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists/*
            /var/cache/apt/archives/*
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Setup Ubuntu (pkg install with fallback)
        run: |
          sudo apt-get update
          FQP=""
          for p in libfreerdp3-dev freerdp3-dev freerdp2-dev; do
            if sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then FQP="$p"; break; fi
          done
          echo "freerdp: '${FQP:-none}'"
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config patchelf python3 wget curl qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev

      # 缓存层 2：cmake 输出树，避免重复源码级编译
      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ github.sha }}
          restore-keys: |
            cmake-build-${{ github.sha }}

      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1

      # 缓存层 3：appimagetool 下载 + quick-sharun 依赖包（/tmp/sharun+*.tar）
      - name: Cache AppImage toolchain
        uses: actions/cache@v4
        with:
          path: |
            appimage/appimagetool
            /tmp/sharun+helper-libs-x86_64.tar
            /tmp/cross-libc-dlopen-x86_64.tar
          key: appimagetool-${{ runner.os }}-${{ hashFiles('appimage/appimagetool', 'appimage/quick-sharun.sh') }}
          restore-keys: |
            appimagetool-${{ runner.os }}-

      - name: Package AppImage
        run: |
          cd appimage
          chmod +x quick-sharun.sh
          export DWARFS_COMP="zstd:level=3"
          ./build-appimage.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-appimage
          path: dist/*.AppImage
          retention-days: 7

  # 创建 Release（仅发版时运行）
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-appimage
    if: >-
      ${{ github.event_name == 'release' && github.event.action == 'published' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rdpcross-appimage
          path: artifacts

      - name: Create Release
        run: |
          version=$(grep kAppVersion src/constants.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version"
          gh release create "v$version" --target main --title "RDPCross v$version" \
            $(ls artifacts/*.AppImage | tr '\n' ' ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
