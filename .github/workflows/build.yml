name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # 1. x86_64 AppImage
  # ---------------------------------------------------------------
  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存层 1：apt 包列表 + 已下载 deb
      - name: Cache apt lists & archives
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists/*
            /var/cache/apt/archives/*
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          FQP=""
          for p in libfreerdp3-dev freerdp3-dev freerdp2-dev; do
            if sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then FQP="$p"; break; fi
          done
          echo "freerdp: '${FQP:-none}'"
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config patchelf python3 wget curl qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev xvfb
          # xvfb 必装：quick-sharun 用 xvfb-run 提供显示，让 Qt 以 xcb 平台
          # 启动，LD_DEBUG=libs 才能抓到运行时 dlopen 的平台插件 libqxcb.so

      # 缓存层 2：cmake 输出树
      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ github.sha }}
          restore-keys: |
            cmake-build-${{ github.sha }}

      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1

      # 缓存层 3：appimagetool + quick-sharun 依赖
      - name: Cache AppImage toolchain
        uses: actions/cache@v4
        with:
          path: |
            appimage/appimagetool
            /tmp/sharun+helper-libs-x86_64.tar
            /tmp/cross-libc-dlopen-x86_64.tar
          key: appimagetool-${{ runner.os }}-${{ hashFiles('appimage/appimagetool','appimage/quick-sharun.sh') }}
          restore-keys: |
            appimagetool-${{ runner.os }}-

      - name: Debug Qt platform plugin loading
        run: |
          echo "=== Qt 版本 ==="
          dpkg -l | grep -E "^ii.*(qt6-base-dev|libqt6gui6)" || true
          echo "=== 系统平台插件目录 ==="
          ls /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/ 2>/dev/null || echo "MISSING"
          echo "=== xvfb 下 LD_DEBUG=libs 跑二进制 ==="
          timeout 15 xvfb-run -a -- env LD_DEBUG=libs ./build/rdpcross \
            >/dev/null 2>/tmp/ld.log || true
          echo "calling init 总数: $(grep -c 'calling init' /tmp/ld.log)"
          echo "--- xcb / plugins / qt 相关 ---"
          grep "calling init" /tmp/ld.log | grep -iE "xcb|plugins/|qt6" | head -15 || echo "NONE"
          echo "--- Qt 报错 ---"
          grep -iE "qt.qpa|failed to start|cannot connect|Could not" /tmp/ld.log | head -10 || true

      - name: Package AppImage
        run: |
          cd appimage
          chmod +x quick-sharun.sh
          export DWARFS_COMP="zstd:level=3"
          # 不能设 QT_QPA_PLATFORM=offscreen：否则 LD_DEBUG=libs 只抓到
          # libqoffscreen.so，libqxcb.so 永远不会被收集，用户机器上
          # Qt 回退系统插件路径 → 版本不兼容 → 启动崩溃
          ./build-appimage.sh

      - name: Verify Qt xcb plugin deployed
        run: |
          # 回归保护：libqxcb.so 是运行时 dlopen 的，quick-sharun 只在
          # 程序能以 xcb 平台真实启动（xvfb-run 提供 display 且未设
          # QT_QPA_PLATFORM=offscreen）时才会收集。缺失会导致用户机器
          # 上 Qt 回退系统插件路径而版本不兼容崩溃。
          if [ -f appimage/AppDir/lib/qt6/plugins/platforms/libqxcb.so ]; then
            echo "XCB PLUGIN OK: $(ls -la appimage/AppDir/lib/qt6/plugins/platforms/libqxcb.so)"
            ls appimage/AppDir/lib/ | grep -i xcb || true
          else
            echo "XCB PLUGIN MISSING — AppImage 无法在用户机器启动"
            find appimage/AppDir -name "*.so*" | grep -iE "xcb|offscreen" || true
            exit 1
          fi

      - name: Upload appimage
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-appimage
          path: dist/*.AppImage
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. arm64（Docker QEMU，容器内原生 gcc + arm64 开发库，一次性构建）
  # ---------------------------------------------------------------
  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Build arm64 (Docker QEMU)
        run: |
          rm -rf build && mkdir -p build
          docker run --rm --platform linux/arm64 --volume "$PWD:/app:rw" ubuntu:noble sh -c '
            cd /app &&
            apt-get update -q > /dev/null 2>&1 && echo "APT UPDATE OK" &&
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config \
              qt6-base-dev freerdp3-dev \
              libasound2-dev libpulse-dev libx11-dev libgl-dev > /dev/null 2>&1 &&
            echo "DEPS READY" &&
            rm -rf build && mkdir -p build &&
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1 &&
            echo "CMAKE OK" &&
            ninja -C build -j1 > /tmp/ninja.log 2>&1 &&
            echo "NINJA OK" &&
            ls -la build/rdpcross
                  '
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-arm64
          path: build/rdpcross
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Release
  # ---------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-appimage, build-arm64]
    # 触发方式：手动（workflow_dispatch）/ push v* tag / release published。
    # 不能只依赖 release 事件 —— 那样本 job 永远不会运行
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'release' && github.event.action == 'published') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        run: |
          version=$(grep kAppVersion src/constants.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version"
          # arm64 裸二进制重命名，避免与 AppImage 混淆
          mv artifacts/rdpcross-arm64/rdpcross "artifacts/rdpcross-arm64/rdpcross-${version}-arm64"
          gh release create "v$version" --target main --title "RDPCross v$version" \
            --generate-notes \
            artifacts/rdpcross-appimage/*.AppImage \
            artifacts/rdpcross-arm64/rdpcross-${version}-arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
