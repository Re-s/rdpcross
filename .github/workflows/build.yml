name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake \
            ninja-build pkg-config patchelf python3 wget curl \
            libqt6core6t64-dev libqt6widgets6t64-dev libqt6gui6t64-dev \
            libqt6sql6t64-dev qt6-base-dev freerdp3-dev \
            libasound2-dev libpulse-dev

      - name: Build binary (ninja -j1, QEMU/ARM only 1 core)
        run: |
          CMAKE_CPU="$(nproc)"
          if [ "${{ matrix.arch }}" = "arm64" ]; then CMAKE_CPU=1; fi
          echo "CPU: $CMAKE_CPU"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DQT6_MINIMAL=ON
          ninja -C build -j"CMAKE_CPU"

      - name: Package AppImage
        run: |
          cd appimage
          chmod +x quick-sharun.sh
          export DWARFS_COMP="zstd:level=3"
          ./build-appimage.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-${{ matrix.arch }}-appimage
          path: dist/*.AppImage

  # 2. x86_64: 创建 Release + 上传
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-appimage
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        run: |
          version=$(grep kAppVersion src/constants.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version"
          gh release create "v$version" --target main --title "RDPCross v$version" \
            $(ls artifacts/*/rdpcross-*.AppImage | tr '\n' ' ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
