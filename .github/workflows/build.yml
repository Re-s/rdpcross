name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # 1. x86_64 AppImage
  # ---------------------------------------------------------------
  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存层 1：apt 包列表 + 已下载 deb
      - name: Cache apt lists & archives
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists/*
            /var/cache/apt/archives/*
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          FQP=""
          for p in libfreerdp3-dev freerdp3-dev freerdp2-dev; do
            if sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then FQP="$p"; break; fi
          done
          echo "freerdp: '${FQP:-none}'"
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            pkg-config patchelf python3 wget curl qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev

      # 缓存层 2：cmake 输出树
      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ github.sha }}
          restore-keys: |
            cmake-build-${{ github.sha }}

      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1

      # 缓存层 3：appimagetool + quick-sharun 依赖
      - name: Cache AppImage toolchain
        uses: actions/cache@v4
        with:
          path: |
            appimage/appimagetool
            /tmp/sharun+helper-libs-x86_64.tar
            /tmp/cross-libc-dlopen-x86_64.tar
          key: appimagetool-${{ runner.os }}-${{ hashFiles('appimage/appimagetool','appimage/quick-sharun.sh') }}
          restore-keys: |
            appimagetool-${{ runner.os }}-

      - name: Package AppImage
        run: |
          cd appimage
          chmod +x quick-sharun.sh
          export DWARFS_COMP="zstd:level=3"
          ./build-appimage.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload appimage
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-appimage
          path: dist/*.AppImage
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. arm64（QEMU 模拟，容器内原生 gcc + arm64 开发库）
  # ---------------------------------------------------------------
  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 in Docker
        id: arm64
        run: |
          set -x
          # 1. 启动 arm64 容器（预装 binfmt 已在 runner 内）
          docker create --name rdpcross-arm64 --platform linux/arm64 ubuntu:noble tail -f /dev/null
          docker start rdpcross-arm64

          # 2. 装依赖（QT6 + FreeRDP3 + 工具链）
          docker exec rdpcross-arm64 sh -c '
            apt-get update -q > /dev/null 2>&1 && echo "APT UPDATE OK"
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config \
              qt6-base-dev freerdp3-dev \
              libasound2-dev libpulse-dev libx11-dev libgl-dev
          '

          # 3. 挂载项目到容器，编译
          docker run --rm --platform linux/arm64 --volume "$PWD:/proj" ubuntu:noble sh -c '
            cd /proj && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -6
            ninja -C build -j1 2>&1 | tail -4
          '
          echo "===" 
          echo "4. 产物位于容器 /proj/build/rdpcross"

      - name: Test arm64 binary
        if: steps.arm64.outcome == 'success'
        run: |
          readelf -h /proj/bin/rdpcross >/dev/null 2>&1 || ls -la /proj/build/rdpcross || :
          echo "arm64 build"

  # ---------------------------------------------------------------
  # 3. Release
  # ---------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-appimage, build-arm64]
    if: >-
      ${{ github.event_name == 'release' && github.event.action == 'published' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        run: |
          version=$(grep kAppVersion src/constants.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version"
          gh release create "v$version" --target main --title "RDPCross v$version" \
            $(ls artifacts/*/rdpcross-*.AppImage 2>/dev/null | tr '\n' ' ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
