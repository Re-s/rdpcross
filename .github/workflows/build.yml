name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug apt names
        run: |
          echo "=== freerdp dev packages ==="
          sudo apt-cache search 'freerdp.*dev' | head -8
          echo "=== qt6 dev packages ==="
          sudo apt-cache search '^qt6.*dev' | head -8
          echo "=== freerdp3 ==="
          which xfreerdp3 freerdp3 xfreerdp 2>&1 | head -5
          echo "=== display libs ==="
          sudo apt-cache search 'headless' | grep -iE 'xvfb|^xvfb' | head -5

      - name: Setup Ubuntu
        run: |
          sudo apt-get update
          FQP=$(sudo apt-cache search 'freerdp2-dev' | awk '{print $1}' | head -2)
          echo "freerdp dev: '${FQP:-none}'"
          [[ -z "$FQP" ]] && FQP="freerdp2-dev"
          sudo apt-get install -y --no-install-recommends build-essential cmake \
            ninja-build pkg-config patchelf python3 wget curl \
            qt6-base-dev "$FQP" \
            libasound2-dev libpulse-dev libx11-dev

      - name: Build binary
        run: |
          echo "CPU: $(nproc)"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j1

      - name: Package AppImage
        run: |
          cd appimage
          chmod +x quick-sharun.sh
          export DWARFS_COMP="zstd:level=3"
          ./build-appimage.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpcross-${{ matrix.arch }}-appimage
          path: dist/*.AppImage

  # 2. x86_64: 创建 Release + 上传
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-appimage
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        run: |
          version=$(grep kAppVersion src/constants.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version"
          gh release create "v$version" --target main --title "RDPCross v$version" \
            $(ls artifacts/*/rdpcross-*.AppImage | tr '\n' ' ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
