name: Test Apt
on:
  workflow_dispatch: {}
jobs:
  dbg:
    name: Debug
    runs-on: ubuntu-latest
    steps:
      - name: Debug apt
        run: |
          echo "=== freerdp dev ==="; sudo apt-cache search 'freerdp.*-dev' | head -10
          echo "=== qt6 dev ==="; b=qt6-base-dev; sudo apt-cache search "^qt6.*-dev" | head -10
          echo "=== freerdp3 ==="; which xfreerdp3 freerdp3 xfreerdp 2>&1 | head -5
          echo "=== apt-cache policy ==="; sudo apt-cache policy freerdp3-dev 2>&1 | head -6
