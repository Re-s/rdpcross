name: T2 APT
on:
  workflow_dispatch: {}
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: Test APT
        run: |
          sudo apt-get update
          echo "=== libfreerdp3-dev ==="
          sudo -A apt-get install -y --no-install-recommends libfreerdp3-dev 2>&1 | tail -3
          echo "=== dpkg list ==="
          dpkg -l | grep -iE 'freerdp|qt6' | head -10
          echo "=== xfreerdp ==="
          which xfreerdp xfreerdp3 2>&1
          echo "=== pkg-config ==="
          pkg-config --modversion freerdp3 2>&1
